apply from: "${rootDir}/scripts/func.gradle"
//配置文件存在，则加载
applyConfig('scripts/core.gradle')
applyConfig('scripts/configs/aosp.gradle')
applyConfig('scripts/configs/car.gradle')
applyConfig('scripts/configs/cts.gradle')
applyConfig('scripts/configs/oppo.gradle')
applyConfig('ext/scripts/configs/ext.gradle')

buildscript {
    repositories {
        google()
        mavenCentral()
        // 配置国内镜像源
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.tencent.com/repository/maven-public' }
        // 可选的备用镜像源
        maven { url 'https://mirrors.tencent.com/android/maven2/' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // 配置国内镜像源
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.tencent.com/repository/maven-public' }
        // 可选的备用镜像源
        maven { url 'https://mirrors.tencent.com/android/maven2/' }
    }
}

gradle.projectsEvaluated {
    // 打印出当前版本
    logger.error("local(current) version = " + rootProject.ext.localVersion)
    logger.error("remote version = " + rootProject.ext.remoteVersion)
    if (rootProject.ext.localVersionInt < rootProject.ext.remoteVersionInt) {
        logger.error("Please update to the latest version via \"git pull --rebase\" command.")
    }
}
