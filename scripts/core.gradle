ext {
    // 当前版本
    localVersion = getCurrentVersion()
    // 远程服务器上的版本（正式版本）
    remoteVersion = getRemoteVersion()
    // 转换成int
    localVersionInt = convertVersionToInt(localVersion)
    remoteVersionInt = convertVersionToInt(remoteVersion)

    Properties properties = getExtProperties()
    // aosp 源码路径
    aospRoot = getRoot(properties)
    // aosp out 路径
    aospOutRoot = getOutRoot(properties, aospRoot)

    // aidl 文件生成 java 文件
    // 可以先设置成 true ，接着 "Rebuild Project" 生成java文件后再设置成 false ，保证正常跳转
    // 因为设置成 true 后，模块为了能正常编译出 java 文件，不能循环模块依赖
    build_aidl = false

    // 如果是 idea 打开这个工程，默认是打开 Java 模块（非Android模块）
    isRunningInIDEA = getIdea()
    isRunningInAndroidStudio = getAndroidStudio()
    isAndroid = getForceAndroidLibrary(properties)
    logger.warn("Running on idea = " + isRunningInIDEA + ", Android Studio = " + isRunningInAndroidStudio)
    logger.warn("Config Android module = " + isAndroid)

    // 设置模块存放 aosp 编译出来的 scr jars 目录
    aosp_srcjars_dir = "build/aosp_srcjars"

    // android开发版本配置
    androidSdk = [
            buildToolsVersion: "34.0.0",
            compileSdkVersion: 34,
            targetSdkVersion : 34,
            minSdkVersion    : 34,
    ]

    // 获取所有的模块
    allModules = getModules(project.subprojects)
}
