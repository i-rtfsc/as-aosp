ext.applyConfig = { file ->
    def asbPath = "${rootDir}/" + file
    logger.warn(asbPath)
    File f = new File(asbPath)
    if (f.exists() && f.isFile()) {
        apply from: asbPath
    }
}

ext.isNotNull = { value ->
    if (!(value == null || value.isEmpty())) {
        return true
    } else {
        return false
    }
}

ext.getModules = { subprojects ->
    def allModules = [:]
    for (Project subproject : subprojects) {
        def project_name = subproject.getName().toString()
        logger.debug(project_name)
        allModules.put(project_name, ":" + project_name)
    }

    return allModules
}

ext.getExtProperties = {
    Properties properties = new Properties()
    try {
        // 检查 ext/scripts/ext.properties 是否存在
        properties.load(project.rootProject.file('ext/scripts/ext.properties').newDataInputStream())
    } catch (Exception e) {
        logger.warn("has not ext/scripts/ext.properties, " + e)
        properties.load(project.rootProject.file('local.properties').newDataInputStream())
    }

    return properties
}

ext.getRoot = { properties ->
    // 检查 ext/scripts/ext.properties or local.properties 是否存在 EXT_AOSP_ROOT
    // 方便其他用户自定义此工程的同时也能随时同步最新代码
    def aospRoot = properties.getProperty('EXT_AOSP_ROOT')
    if (isNotNull(aospRoot)) {
        logger.warn("set aosp root from ext/scripts/ext.properties or local.properties")
    } else {
        logger.warn("has not set ext aosp root")
        //设置源码所在的目录
        aospRoot = "/home/solo/code/miui"
        if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
            aospRoot = "/Users/solo/code/miui"
        }
    }
    logger.warn("aospRoot = " + aospRoot)

    return aospRoot
}

ext.getOutRoot = { properties, root_dir ->
    // 检查 ext/scripts/ext.properties or local.properties 是否存在 EXT_AOSP_OUT_ROOT
    // 方便其他用户自定义此工程的同时也能随时同步最新代码
    def aospOutRoot = properties.getProperty('EXT_AOSP_OUT_ROOT')
    if (isNotNull(aospOutRoot)) {
        logger.warn("set aosp out root from ext/scripts/ext.properties or local.properties")
    } else {
        logger.warn("has not set ext aosp out root")
        // 未设置额外的 out 目录，则默认是在源码根目录下
        aospOutRoot = root_dir
    }
    logger.warn("aospOutRoot = " + aospOutRoot)

    return aospOutRoot
}


ext.getForceAndroidLibrary = { properties ->
    // 检查 ext/scripts/ext.properties or local.properties 是否存在 EXT_FORCE_ANDROID_LIBRARY
    def forceAndroidLibrary = properties.getProperty('EXT_FORCE_ANDROID_LIBRARY')
    if (isNotNull(forceAndroidLibrary)) {
        logger.warn("set forceAndroidLibrary from ext/scripts/ext.properties or local.properties")
        forceAndroidLibrary = forceAndroidLibrary.toBoolean()
    } else {
        // 判断是否在中 as 中运行，
        def isRunningInIDEA = System.getenv("IDEA_INITIAL_DIRECTORY") != null
        def isRunningInAndroidStudio = !isRunningInIDEA && System.getProperty('idea.active') != null
        logger.warn("Running on as = " + isRunningInAndroidStudio)
        forceAndroidLibrary = isRunningInAndroidStudio
    }

    return forceAndroidLibrary
}